<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Warm Cream -->
    <linearGradient id="pikoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FFEAD5"/>
    </linearGradient>

    <!-- Piko Orange Fur Gradient -->
    <linearGradient id="pikoFurGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9E2C"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Gold Shield Coin Gradient -->
    <linearGradient id="pikoCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Emerald Gem Gradient -->
    <linearGradient id="pikoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Mascot Shadow -->
    <filter id="pikoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#EA580C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="118" fill="url(#pikoBgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#FED7AA" stroke-width="4"/>

  <!-- Subtle Ambient Glow Behind Head -->
  <circle cx="256" cy="245" r="170" fill="#FFEDD5" opacity="0.6"/>

  <!-- Piko Cat Mascot Group -->
  <g filter="url(#pikoShadow)">
    <!-- Cat Ears -->
    <!-- Left Ear -->
    <path d="M 125,230 L 140,95 C 142,85 155,80 165,88 L 225,145 Z" fill="url(#pikoFurGrad)"/>
    <!-- Left Inner Ear (Pink) -->
    <path d="M 142,210 L 152,112 C 153,107 160,105 164,109 L 205,148 Z" fill="#FFAAA6"/>

    <!-- Right Ear -->
    <path d="M 387,230 L 372,95 C 370,85 357,80 347,88 L 287,145 Z" fill="url(#pikoFurGrad)"/>
    <!-- Right Inner Ear (Pink) -->
    <path d="M 370,210 L 360,112 C 359,107 352,105 348,109 L 307,148 Z" fill="#FFAAA6"/>

    <!-- Piko Head (Round Cute Chibi) -->
    <ellipse cx="256" cy="245" rx="145" ry="128" fill="url(#pikoFurGrad)"/>

    <!-- Forehead Stripes (Cute Tabby Accent) -->
    <path d="M 256,128 L 256,160" stroke="#C2410C" stroke-width="8" stroke-linecap="round"/>
    <path d="M 235,138 L 240,165" stroke="#C2410C" stroke-width="6" stroke-linecap="round"/>
    <path d="M 277,138 L 272,165" stroke="#C2410C" stroke-width="6" stroke-linecap="round"/>

    <!-- Cute Cheeks Blush -->
    <ellipse cx="168" cy="268" rx="24" ry="14" fill="#FFAAA6" opacity="0.75"/>
    <ellipse cx="344" cy="268" rx="24" ry="14" fill="#FFAAA6" opacity="0.75"/>

    <!-- White Muzzle / Snout -->
    <ellipse cx="256" cy="272" rx="68" ry="46" fill="#FFFFFF"/>

    <!-- Cat Whiskers -->
    <!-- Left Whiskers -->
    <line x1="120" y1="262" x2="195" y2="268" stroke="#C2410C" stroke-width="5" stroke-linecap="round"/>
    <line x1="115" y1="284" x2="192" y2="280" stroke="#C2410C" stroke-width="5" stroke-linecap="round"/>
    <!-- Right Whiskers -->
    <line x1="392" y1="262" x2="317" y2="268" stroke="#C2410C" stroke-width="5" stroke-linecap="round"/>
    <line x1="397" y1="284" x2="320" y2="280" stroke="#C2410C" stroke-width="5" stroke-linecap="round"/>

    <!-- Sparkling Anime Cat Eyes -->
    <!-- Left Eye -->
    <ellipse cx="198" cy="220" rx="22" ry="26" fill="#1E293B"/>
    <circle cx="206" cy="210" r="8" fill="#FFFFFF"/>
    <circle cx="192" cy="230" r="4" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="314" cy="220" rx="22" ry="26" fill="#1E293B"/>
    <circle cx="322" cy="210" r="8" fill="#FFFFFF"/>
    <circle cx="308" cy="230" r="4" fill="#FFFFFF"/>

    <!-- Cute Brown Cat Nose -->
    <path d="M 256,260 L 246,248 C 248,245 264,245 266,248 Z" fill="#7C2D12"/>

    <!-- Smiling Cat Mouth 'w' -->
    <path d="M 242,268 Q 249,280 256,270 Q 263,280 270,268" stroke="#7C2D12" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Piko's Gold Shield Coin Collar (Zero Buy Wealth Guard) -->
    <g transform="translate(0, 10)">
      <!-- Collar Ribbon -->
      <path d="M 180,342 Q 256,365 332,342" stroke="#DC2626" stroke-width="14" stroke-linecap="round" fill="none"/>
      
      <!-- Gold Shield Coin -->
      <path d="M 256,330 L 295,350 C 295,395 275,425 256,442 C 237,425 217,395 217,350 Z" 
            fill="url(#pikoCoinGrad)" 
            stroke="#FFFFFF" 
            stroke-width="5" 
            stroke-linejoin="round"/>
      
      <!-- Inner Emerald Diamond -->
      <polygon points="256,360 270,380 256,400 242,380" fill="url(#pikoEmeraldGrad)"/>
      <circle cx="256" cy="380" r="4" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
