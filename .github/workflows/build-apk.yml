name: Auto Build Zero Buy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install Dependensi Node
        run: npm install

      - name: 5. Bundling Frontend (src -> www)
        run: node build.js

      - name: 6. Sinkronisasi Capacitor Native
        run: npx cap sync android

      - name: 7. Berikan Hak Eksekusi Gradlew
        run: chmod +x android/gradlew

      - name: 8. Kompilasi Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 9. Unggah Hasil APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Buy-v4.0-PointZero-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
