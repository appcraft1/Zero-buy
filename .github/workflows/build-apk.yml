name: Auto Build Zero Buy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install Dependensi Node
        run: npm install

      - name: 6. Bundling Frontend (src -> www)
        run: node build.js

      - name: 7. Sinkronisasi Capacitor Native
        run: npx cap sync android

      - name: 8. Konfigurasi SDK & Hak Eksekusi
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew

      - name: 9. Kompilasi Android APK (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Unggah Hasil APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Buy-v4.0-PointZero-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
