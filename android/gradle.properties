# Project-wide Gradle settings (Ultra-Low Memory Mode for ASUS Vivobook)
org.gradle.jvmargs=-Xms128m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -Xss512k -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
android.useAndroidX=true
android.enableJetifier=true
